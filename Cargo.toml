[workspace]
members = [
    "everymap-core",
    "everymap-providers-here",
    "everymap-providers-google",
    "everymap-cli",
    "everymap-providers-tomtom",
    "everymap-providers-mapbox",
    "everymap-providers-radar",
    "everymap-bench",
]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "MIT"
authors = ["angoratek"]
repository = "https://github.com/angoratek/everymap-rs"
rust-version = "1.86"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
enum_variant_names = "allow"
doc_markdown = "allow"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "query", "form"] }
thiserror = "1.0"
flexpolyline = "1.0"
wiremock = "0.6"
zeroize = { version = "1", features = ["derive"] }
chrono = "0.4"
log = "0.4"
everymap-core = { path = "everymap-core", version = "0.2.2" }
everymap-providers-here = { path = "everymap-providers-here", version = "0.2.2" }
everymap-providers-google = { path = "everymap-providers-google", version = "0.2.2" }
everymap-providers-tomtom = { path = "everymap-providers-tomtom", version = "0.2.2" }
everymap-providers-mapbox = { path = "everymap-providers-mapbox", version = "0.2.2" }
everymap-providers-radar = { path = "everymap-providers-radar", version = "0.2.2" }