[package]
name = "everymap-cli"
version.workspace = true
edition.workspace = true
description = "Unified CLI for geospatial APIs — geocode, route, match, and more across 5 providers"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["geospatial", "maps", "cli", "api"]
categories = ["command-line-utilities", "science::geo"]
readme = "README.md"
documentation = "https://docs.rs/everymap-cli"
authors.workspace = true

[[bin]]
name = "everymap"
path = "src/main.rs"

[dependencies]
everymap-core = { workspace = true }
everymap-providers-here = { workspace = true }
everymap-providers-google = { workspace = true }
everymap-providers-tomtom = { workspace = true }
everymap-providers-mapbox = { workspace = true }
everymap-providers-radar = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
directories = "6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
[lints]
workspace = true
