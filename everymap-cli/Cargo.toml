[package]
name = "everymap-cli"
version = "0.2.0"
edition = "2021"
description = "Unified CLI for geospatial APIs — geocode, route, match, and more across 5 providers"
license = "MIT"
repository = "https://github.com/angoratek/everymap-rs"
keywords = ["geospatial", "maps", "cli", "api"]
categories = ["command-line-utilities", "science::geo"]

[[bin]]
name = "everymap"
path = "src/main.rs"

[dependencies]
everymap-core = { workspace = true }
everymap-providers-here = { workspace = true }
everymap-providers-google = { workspace = true }
everymap-providers-tomtom = { workspace = true }
everymap-providers-mapbox = { workspace = true }
everymap-providers-radar = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
directories = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"