[package]
name = "everymap-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Cross-provider benchmark framework for EveryMap"
license.workspace = true
repository.workspace = true

[[bin]]
name = "everymap-bench"
path = "src/main.rs"

[dependencies]
everymap-core = { workspace = true }
everymap-providers-here = { workspace = true }
everymap-providers-google = { workspace = true }
everymap-providers-tomtom = { workspace = true }
everymap-providers-mapbox = { workspace = true }
everymap-providers-radar = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[lints]
workspace = true
