[package]
name = "everymap-core"
version = "0.2.0"
edition = "2021"
description = "Core traits, types, and error handling for EveryMap — unified geospatial API abstraction"
license = "MIT"
repository = "https://github.com/angoratek/everymap-rs"
keywords = ["geospatial", "maps", "api", "abstraction"]
categories = ["api-bindings", "science::geo"]

[features]
integration = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
futures = { workspace = true }
flexpolyline = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
everymap-providers-here = { workspace = true }
everymap-providers-google = { workspace = true }
everymap-providers-tomtom = { workspace = true }
everymap-providers-mapbox = { workspace = true }
