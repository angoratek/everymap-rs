name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run of the crate publish. The publish script skips versions that
  # are already on crates.io, so this is the recovery path for a partial
  # publish; binaries and the GitHub Release are produced only for a tag push.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --all-features
      - run: chmod +x scripts/check-publish-readiness.sh
      - run: ./scripts/check-publish-readiness.sh --verbose

  build-binaries:
    needs: check
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p everymap-cli
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: everymap-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/everymap${{ runner.os == 'Windows' && '.exe' || '' }}

  publish-crates:
    needs: check
    runs-on: ubuntu-latest
    environment: crates.io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: chmod +x scripts/publish-crates.sh
      - run: ./scripts/publish-crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  create-release:
    needs: [build-binaries, publish-crates]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      # Artifacts share the binary name `everymap` across targets; rename each
      # to its artifact name so the release assets do not collide.
      - name: Rename binaries with target suffix
        run: |
          for artifact_dir in artifacts/*/; do
            artifact_name="$(basename "$artifact_dir")"
            for file in "$artifact_dir"everymap "$artifact_dir"everymap.exe; do
              if [ -f "$file" ]; then
                case "$(basename "$file")" in
                  everymap.exe) mv "$file" "artifacts/${artifact_name}.exe" ;;
                  *)
                    mv "$file" "artifacts/${artifact_name}.tmp"
                    rmdir "$artifact_dir"
                    mv "artifacts/${artifact_name}.tmp" "artifacts/${artifact_name}"
                    ;;
                esac
              fi
            done
          done
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true