name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer push supersedes the run it replaced. A pull request and a push to
  # its branch share one group, so only the latest commit is checked.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: chmod +x scripts/check-provider-transport-isolation.sh
      - run: ./scripts/check-provider-transport-isolation.sh
      - run: chmod +x scripts/check-open-source-hygiene.sh
      - run: ./scripts/check-open-source-hygiene.sh

  dco:
    # An outside contribution signs the Developer Certificate of Origin;
    # maintainer commits carry no trailer. This runs only on a pull request
    # from someone without write access, and checks the commits it adds.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.author_association != 'COLLABORATOR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: git fetch --no-tags origin "${{ github.base_ref }}"
      - run: node scripts/check-dco-signoff.mjs --base "origin/${{ github.base_ref }}"

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The browser closure: core plus every provider crate. The CLI and the
      # bench are native applications, so they stay out of it.
      - name: Build the browser closure
        run: >-
          cargo build --target wasm32-unknown-unknown
          -p everymap-core
          -p everymap-providers-here
          -p everymap-providers-google
          -p everymap-providers-tomtom
          -p everymap-providers-mapbox
          -p everymap-providers-radar
          -p everymap-providers-mapquest
          -p everymap-providers-photon
          -p everymap-providers-osrm
          -p everymap-providers-valhalla
          -p everymap-providers-url-template-raster
          -p everymap-providers-url-template-vector
      # Every cargo argument goes before the `--`: anything after it is handed
      # to rustc, so a `-p` there would be ignored and cargo would lint the
      # whole workspace instead of this closure, dragging the native test
      # harness's tokio (and mio, which refuses wasm32) into the build.
      - name: Clippy the browser closure
        run: >-
          cargo clippy --target wasm32-unknown-unknown --lib
          -p everymap-core
          -p everymap-providers-here
          -p everymap-providers-google
          -p everymap-providers-tomtom
          -p everymap-providers-mapbox
          -p everymap-providers-radar
          -p everymap-providers-mapquest
          -p everymap-providers-photon
          -p everymap-providers-osrm
          -p everymap-providers-valhalla
          -p everymap-providers-url-template-raster
          -p everymap-providers-url-template-vector
          -- -D warnings

  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The wasm-bindgen CLI must match the resolved library version.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.117
      - run: npm install --no-save --no-package-lock playwright@1.49.0
      - run: npx playwright install --with-deps chromium
      - run: chmod +x scripts/browser-smoke.sh
      - run: ./scripts/browser-smoke.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The documentation gates: rustdoc warnings fail the build, and the
      # per-crate READMEs must match the fragments they are generated from.
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
      - run: chmod +x scripts/generate-readmes.sh
      - run: scripts/generate-readmes.sh --check
      # The README's links and its provider/crate tables are hand-written;
      # the CLI must at least build and answer `--help` in this job.
      - run: cargo run -p everymap-cli -- --help > /dev/null

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --all-features --profile ci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: nextest-junit
          path: target/nextest/junit.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p everymap-cli
      # The feature-gated configurations: no provider at all, and one
      # provider. Both must build and the minimal binary must answer --help.
      - name: Build with no providers
        run: cargo build --release --no-default-features -p everymap-cli
      - name: Build a HERE-only CLI
        run: cargo build --release --no-default-features --features here -p everymap-cli
      - name: Check the HERE-only CLI answers --help
        run: ./target/release/everymap --help > /dev/null

  check-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: chmod +x scripts/check-publish-readiness.sh
      - run: ./scripts/check-publish-readiness.sh --verbose

  cli-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: chmod +x scripts/validate-cli.sh
      - run: ./scripts/validate-cli.sh --quiet --json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: validate-results
          path: validate-results/