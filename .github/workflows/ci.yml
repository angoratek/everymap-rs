name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: chmod +x scripts/check-provider-transport-isolation.sh
      - run: ./scripts/check-provider-transport-isolation.sh

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The browser closure: core plus every provider crate. The CLI and the
      # bench are native applications, so they stay out of it.
      - name: Build the browser closure
        run: >-
          cargo build --target wasm32-unknown-unknown
          -p everymap-core
          -p everymap-providers-here
          -p everymap-providers-google
          -p everymap-providers-tomtom
          -p everymap-providers-mapbox
          -p everymap-providers-radar
          -p everymap-providers-mapquest
          -p everymap-providers-photon
          -p everymap-providers-osrm
          -p everymap-providers-valhalla
          -p everymap-providers-url-template-raster
          -p everymap-providers-url-template-vector
      - name: Clippy the browser closure
        run: >-
          cargo clippy --target wasm32-unknown-unknown --lib -- -D warnings
          -p everymap-core
          -p everymap-providers-here
          -p everymap-providers-google
          -p everymap-providers-tomtom
          -p everymap-providers-mapbox
          -p everymap-providers-radar
          -p everymap-providers-mapquest
          -p everymap-providers-photon
          -p everymap-providers-osrm
          -p everymap-providers-valhalla
          -p everymap-providers-url-template-raster
          -p everymap-providers-url-template-vector

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --all-features --profile ci
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: nextest-junit
          path: target/nextest/junit.xml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p everymap-cli

  check-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: chmod +x scripts/check-publish-readiness.sh
      - run: ./scripts/check-publish-readiness.sh --verbose

  cli-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: chmod +x scripts/validate-cli.sh
      - run: ./scripts/validate-cli.sh --quiet --json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: validate-results
          path: validate-results/